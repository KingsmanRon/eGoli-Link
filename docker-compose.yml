version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: citypower
      POSTGRES_PASSWORD: password
      POSTGRES_DB: citypower_dispatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citypower"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://citypower:password@postgres:5432/citypower_dispatch
      - NODE_ENV=production
      - JWT_SECRET=production-secret-change-me
      - JWT_REFRESH_SECRET=production-refresh-secret-change-me
      - CORS_ORIGIN=http://localhost
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
  uploads:
